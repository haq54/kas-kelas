<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#F2F4F1;--surface:#fff;--field:#F6F8F5;--ink:#16231F;--muted:#5E6B66;--line:#DCE2DD;--accent:#1F4E79;--accent-ink:#fff;--in:#18794E;--in-soft:#E1F1E8;--out:#B23A2B;--out-soft:#F8E6E2;--warn:#8A6100;--warn-soft:#FBF0D0;
--fd:"Familjen Grotesk",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1613;--surface:#18221E;--field:#121B17;--ink:#E7EEEA;--muted:#93A39B;--line:#2A3832;--accent:#7FB0E0;--accent-ink:#0F1613;--in:#5CC58D;--in-soft:#173126;--out:#F0897A;--out-soft:#3A1D19;--warn:#E6C265;--warn-soft:#3A311A}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1613;--surface:#18221E;--field:#121B17;--ink:#E7EEEA;--muted:#93A39B;--line:#2A3832;--accent:#7FB0E0;--accent-ink:#0F1613;--in:#5CC58D;--in-soft:#173126;--out:#F0897A;--out-soft:#3A1D19;--warn:#E6C265;--warn-soft:#3A311A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);padding:20px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
h1{font:700 1.6rem/1.2 var(--fd);margin:0}h2{font:600 1.05rem/1.3 var(--fd);margin:0}
.badge{font-size:.78rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{height:36px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:600;font-size:.88rem;cursor:pointer}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lab{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font:700 clamp(2rem,8vw,2.8rem)/1.1 var(--fd);font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.sm{font-size:.85rem;color:var(--muted);margin:0}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem;font-weight:500}
.alert.red{background:var(--out-soft);color:var(--out)}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;background:var(--field);border:1px solid var(--line);border-radius:8px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 9rem}
.btn{min-height:42px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;flex:0 0 auto;width:auto}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.sm2{min-height:34px;padding:0 12px;font-size:.85rem}.btn.del{color:var(--out)}
.m{border-top:1px solid var(--line);padding:10px 0;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.m:first-child{border-top:0}.m b{display:block}.m small{color:var(--muted);font-family:var(--fm)}
.chip{font-size:.78rem;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.lunas{background:var(--in-soft);color:var(--in)}.kurang{background:var(--warn-soft);color:var(--warn)}.belum{background:var(--out-soft);color:var(--out)}.off{background:var(--field);color:var(--muted)}
.det{background:var(--field);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{font-size:.72rem;color:var(--muted);text-transform:uppercase;border-top:0}
.pv{font-size:.85rem;border-top:1px solid var(--line);padding:4px 0;display:flex;gap:8px}.pv span:last-child{margin-left:auto}
.err{color:var(--out);font-size:.88rem;margin:0}.ok{color:var(--in);font-size:.88rem;margin:0}
.in{color:var(--in)}.out{color:var(--out)}
 #lgn{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lgc{width:100%;max-width:400px;gap:12px;padding:22px}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;font:inherit;font-size:.88rem;cursor:pointer;align-self:center;padding:6px}
</style>

</head><body><div class="wrap">
<header><h1>Kas Kelas</h1><span class="badge" id="role">Memuat…</span></header>
<nav id="nav"></nav><div id="note"></div><div id="view"></div></div>
 <div id="lgn" hidden>
 <form id="lgF" class="card lgc">
  <h1>Kas Kelas</h1>
  <p class="sm">Masuk sebagai bendahara untuk mengubah data kas.</p>
  <label class="lab" for="lgE">Email</label>
  <input id="lgE" type="email" autocomplete="username" placeholder="nama@email.com" required>
  <label class="lab" for="lgS">Kata sandi</label>
  <input id="lgS" type="password" autocomplete="current-password" placeholder="Kata sandi" required>
  <div id="lgErr" class="sm" role="alert" style="color:var(--out)"></div>
  <button class="btn" id="lgBtn" type="submit" style="width:100%">Masuk</button>
  <button class="btn ghost" id="lgBatal" type="button" style="width:100%">Kembali</button>
  <button class="lnk" id="lgLupa" type="button">Lupa kata sandi?</button>
 </form>
 </div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var db=null,canEdit=false,M=[],P=[],X=[],LOG=[],CFG={base:10000,naik:[]},D=[],tab='home',sel=null,armed='',sortBy='nama',q='',loaded=0,tmo;
var rp=function(n){return (n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var cur=function(){return today().slice(0,7)};
var BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var bln=function(s){var a=s.split('-');return BL[a[1]-1]+' '+a[0]};
var sum=function(a,f){return a.reduce(function(t,x){return t+(f(x)||0)},0)};
function mr(a,b){var r=[],p=a.split('-').map(Number),e=b.split('-').map(Number),y=p[0],m=p[1];while(y<e[0]||(y===e[0]&&m<=e[1])){r.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}return r}
function nom(b){var n=CFG.base||10000;(CFG.naik||[]).slice().sort(function(a,c){return a.dari<c.dari?-1:1}).forEach(function(x){if(x.dari<=b)n=x.nominal});return n}
function calc(m){var c=cur(),end=(m.aktif===false&&m.selesai&&m.selesai<c)?m.selesai:c;
 var bl=m.mulai&&m.mulai<=end?mr(m.mulai,end):[];
 var paid=sum(P.filter(function(p){return p.mid===m.id}),function(p){return p.jumlah})-sum(X.filter(function(x){return x.mid===m.id&&x.kind==='kembali'}),function(x){return x.jumlah});
 var left=paid,rows=bl.map(function(b){var n=nom(b),k=Math.max(0,Math.min(left,n));left-=k;return {b:b,n:n,c:k}});
 var tagih=sum(rows,function(r){return r.n}),cr=rows[rows.length-1];
 return {rows:rows,paid:paid,tagih:tagih,kurang:Math.max(0,tagih-paid),kredit:Math.max(0,paid-tagih),st:tagih<=paid?'lunas':(cr&&cr.c>0?'kurang':'belum')};
}
function derive(){D=M.map(function(m){return Object.assign({},m,calc(m))})}
function logw(a,k){if(db)db.collection('log').add({ts:Date.now(),aksi:a,ket:k}).catch(function(){})}
function money(el){el.addEventListener('input',function(){var d=el.value.replace(/\D/g,'').slice(0,12);el.value=d?Number(d).toLocaleString('id-ID'):''})}
var num=function(s){return parseInt(String(s).replace(/\D/g,'')||'0',10)};
function arm(k){if(armed===k)return true;armed=k;setTimeout(function(){armed='';fill()},3500);fill();return false}
function dup(nim,except){return nim&&M.some(function(m){return m.nim===nim&&m.id!==except})}

/* ---------- Tabs ---------- */
function nav(){var t=[['home','Beranda'],['anggota','Anggota'],['catat','Catat'],['laporan','Laporan']];
 if(!canEdit)t.splice(2,1);
 $('#nav').style.gridTemplateColumns='repeat('+t.length+',1fr)';
 $('#nav').innerHTML=t.map(function(x){return '<button data-t="'+x[0]+'" aria-pressed="'+(tab===x[0])+'">'+x[1]+'</button>'}).join('')}
$('#nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;show()}});
function show(){nav();var v=$('#view');
 if(tab==='home')v.innerHTML='<div id="sum" class="wrap"></div>';
 if(tab==='anggota'){v.innerHTML='<div class="wrap"><div class="card"><div class="row"><input id="q" placeholder="Cari nama atau NIM" value="'+esc(q)+'"><select id="so"><option value="nama">Urut nama</option><option value="nim">Urut NIM</option></select></div><div id="list"></div></div><div id="adm" class="wrap"></div></div>';
  $('#so').value=sortBy;$('#q').oninput=function(){q=this.value;fAng()};$('#so').onchange=function(){sortBy=this.value;fAng()};adm()}
 if(tab==='catat'){v.innerHTML='<div class="wrap"><form id="fp" class="card"><h2>Catat iuran masuk</h2><select id="pm" required></select><div class="row"><input id="pt" type="date" required><input id="pj" inputmode="numeric" placeholder="Jumlah (Rp)" required></div><button class="btn">Simpan iuran</button><p id="pmsg" class="sm"></p></form><form id="fx" class="card"><h2>Catat pengeluaran</h2><input id="xk" placeholder="Keperluan, misalnya fotokopi materi" required><div class="row"><input id="xt" type="date" required><input id="xj" inputmode="numeric" placeholder="Jumlah (Rp)" required></div><button class="btn">Simpan pengeluaran</button><p id="xmsg" class="sm"></p></form><div class="card"><h2>Catatan terakhir</h2><div id="hist"></div></div></div>';
  $('#pt').value=$('#xt').value=today();money($('#pj'));money($('#xj'));$('#fp').onsubmit=addPay;$('#fx').onsubmit=addExp}
 if(tab==='laporan')v.innerHTML='<div id="rep" class="wrap"></div>';
 fill()}
function fill(){if(!loaded&&db){return}derive();({home:fHome,anggota:fAng,catat:fCatat,laporan:fRep})[tab]()}

/* ---------- Beranda ---------- */
function fHome(){var ak=D.filter(function(m){return m.aktif!==false}),inn=sum(P,function(p){return p.jumlah}),out=sum(X,function(x){return x.jumlah}),tt=sum(D,function(m){return m.kredit}),bk=ak.filter(function(m){return m.kurang>0}),tg=sum(ak,function(m){return m.kurang});
 var nk=D.filter(function(m){return m.aktif===false&&m.kredit>0});
 $('#sum').innerHTML='<div class="card"><span class="lab">Saldo kas kelas</span><span class="big mono '+(inn-out-tt<0?'out':'')+'">'+rp(inn-out-tt)+'</span>'+
 '<p class="sm">Uang di tangan bendahara: '+rp(inn-out)+(tt>0?' &middot; titipan anggota: '+rp(tt):'')+'</p>'+
 '<div class="grid"><div><span class="lab in">Masuk</span><div class="mono">'+rp(inn)+'</div></div><div><span class="lab out">Keluar</span><div class="mono">'+rp(out)+'</div></div></div></div>'+
 (bk.length?'<div class="alert red">'+bk.length+' anggota belum lunas &middot; total tunggakan '+rp(tg)+'. Lihat tab Anggota.</div>':'<div class="alert" style="background:var(--in-soft);color:var(--in)">Semua anggota aktif sudah lunas sampai '+bln(cur())+'.</div>')+
 (nk.length?'<div class="alert">'+nk.length+' anggota nonaktif masih punya lebihan yang perlu dikembalikan.</div>':'')+
 '<div class="card"><h2>Pengeluaran terakhir</h2>'+(X.filter(function(x){return x.kind!=='kembali'}).sort(function(a,b){return a.tgl<b.tgl?1:-1}).slice(0,5).map(function(x){return '<div class="pv"><span>'+esc(x.tgl)+'</span><span>'+esc(x.ket)+'</span><span class="mono out">'+rp(x.jumlah)+'</span></div>'}).join('')||'<p class="sm">Belum ada pengeluaran.</p>')+'</div>'}

/* ---------- Anggota ---------- */
function stl(m){return m.aktif===false?'<span class="chip off">nonaktif</span>':'<span class="chip '+m.st+'">'+m.st+'</span>'}
function fAng(){var f=q.toLowerCase(),L=D.filter(function(m){return !f||m.nama.toLowerCase().indexOf(f)>-1||String(m.nim).indexOf(f)>-1});
 L.sort(function(a,b){return sortBy==='nim'?String(a.nim).localeCompare(String(b.nim),'id',{numeric:true}):a.nama.localeCompare(b.nama,'id')});
 $('#list').innerHTML=L.map(function(m){var o='<div class="m" data-s="'+m.id+'"><div><b>'+esc(m.nama)+'</b><small>'+esc(m.nim||'tanpa NIM')+'</small></div><div style="text-align:right">'+stl(m)+(m.kurang>0&&m.aktif!==false?'<div class="sm mono">kurang '+rp(m.kurang)+'</div>':'')+(m.kredit>0?'<div class="sm mono in">lebih '+rp(m.kredit)+'</div>':'')+'</div></div>';
  if(sel===m.id)o+=detail(m);return o}).join('')||'<p class="sm">'+(M.length?'Tidak ada yang cocok.':'Belum ada anggota.'+(canEdit?' Impor daftar di bawah.':''))+'</p>'}
function detail(m){var ps=P.filter(function(p){return p.mid===m.id}).sort(function(a,b){return a.tgl<b.tgl?1:-1});
 var h='<div class="det"><table><tr><th>Bulan</th><th>Tagihan</th><th>Terbayar</th></tr>'+m.rows.slice().reverse().map(function(r){return '<tr><td>'+bln(r.b)+'</td><td class="mono">'+rp(r.n)+'</td><td class="mono '+(r.c>=r.n?'in':'out')+'">'+rp(r.c)+'</td></tr>'}).join('')+'</table>'+
 '<p class="sm">Mulai ditagih: '+(m.mulai?bln(m.mulai):'-')+(m.selesai?' &middot; berhenti: '+bln(m.selesai):'')+'</p>'+
 ps.map(function(p){return '<div class="pv"><span>'+esc(p.tgl)+'</span><span class="mono in">'+rp(p.jumlah)+'</span>'+(canEdit?'<span><button class="btn ghost sm2 del" data-a="dp" data-id="'+p.id+'">'+(armed==='dp'+p.id?'Yakin?':'Hapus')+'</button></span>':'')+'</div>'}).join('');
 if(canEdit){h+='<div class="row"><input id="en" value="'+esc(m.nama)+'"><input id="ei" value="'+esc(m.nim)+'" inputmode="numeric"><button class="btn sm2" data-a="sv" data-id="'+m.id+'">Simpan</button></div><p id="emsg" class="err"></p><div class="row">'+
  (m.kredit>0?'<button class="btn ghost sm2" data-a="kb" data-id="'+m.id+'">Kembalikan lebihan '+rp(m.kredit)+'</button>':'')+
  '<button class="btn ghost sm2" data-a="tg" data-id="'+m.id+'">'+(m.aktif===false?'Aktifkan lagi':'Nonaktifkan')+'</button>'+
  (ps.length?'':'<button class="btn ghost sm2 del" data-a="dm" data-id="'+m.id+'">'+(armed==='dm'+m.id?'Yakin hapus?':'Hapus anggota')+'</button>')+'</div>'+
  (m.aktif===false&&m.kredit>0?'<p class="err">Anggota nonaktif masih punya lebihan: kembalikan karena tidak ada bulan berikutnya.</p>':'')}
 return h+'</div>'}
$('#view').addEventListener('click',function(e){
 var b=e.target.closest('button[data-a]');
 if(!b){var r=e.target.closest('[data-s]');if(r){sel=sel===r.dataset.s?null:r.dataset.s;fAng()}return}
 if(!db||!canEdit)return;var a=b.dataset.a,id=b.dataset.id,m=D.find(function(x){return x.id===id});
 if(a==='sv'){var n=$('#en').value.trim().replace(/\s+/g,' '),i=$('#ei').value.trim();
  if(!n){$('#emsg').textContent='Nama tidak boleh kosong.';return}
  if(dup(i,id)){$('#emsg').textContent='NIM itu sudah dipakai anggota lain.';return}
  db.doc('members/'+id).update({nama:n,nim:i});logw('Ubah anggota',m.nama+' (NIM '+m.nim+') menjadi '+n+' (NIM '+i+')')}
 if(a==='tg'){if(m.aktif===false){db.doc('members/'+id).update({aktif:true,selesai:null})}else{db.doc('members/'+id).update({aktif:false,selesai:cur()})}logw('Status anggota',m.nama+(m.aktif===false?' diaktifkan':' dinonaktifkan'))}
 if(a==='kb'){db.collection('exp').add({tgl:today(),ket:'Pengembalian kelebihan - '+m.nama,jumlah:m.kredit,kind:'kembali',mid:id,ts:Date.now()});logw('Kembalikan lebihan',m.nama+' '+rp(m.kredit))}
 if(a==='dp'){if(!arm('dp'+id))return;var p=P.find(function(x){return x.id===id});db.doc('pay/'+id).delete();logw('Hapus iuran',(M.find(function(x){return x.id===p.mid})||{}).nama+' '+rp(p.jumlah)+' tgl '+p.tgl)}
 if(a==='dx'){if(!arm('dx'+id))return;var x=X.find(function(z){return z.id===id});db.doc('exp/'+id).delete();logw('Hapus catatan keluar',x.ket+' '+rp(x.jumlah))}
 if(a==='dm'){if(!arm('dm'+id))return;db.doc('members/'+id).delete();sel=null;logw('Hapus anggota',m.nama)}
});

/* ---------- Impor & tambah anggota ---------- */
function adm(){var h=$('#adm');if(!canEdit){h.innerHTML='';return}
 h.innerHTML='<div class="card"><h2>Tambah anggota</h2><div class="row"><input id="an" placeholder="Nama"><input id="ai" inputmode="numeric" placeholder="NIM"><input id="am" type="month" value="'+cur()+'"></div><button class="btn" id="aok">Tambah</button><p id="amsg" class="err"></p></div>'+
 '<div class="card"><h2>Impor massal</h2><p class="sm">Tempel satu anggota per baris (nama dan NIM, dipisah tab, koma, atau spasi). Nomor urut di depan diabaikan.</p><textarea id="ib" placeholder="Ahmad Haqi 2021001&#10;Budi Santoso, 2021002"></textarea><div class="row"><label class="sm">Mulai ditagih bulan<input id="im" type="month" value="'+cur()+'"></label></div><div id="ipv"></div><div class="row"><button class="btn ghost" id="ipr">Pratinjau</button><button class="btn" id="iok" hidden>Impor</button><button class="btn ghost del" id="iun">Batalkan impor terakhir</button></div><p id="imsg" class="sm"></p></div>'+
 '<div class="card"><h2>Pengaturan iuran</h2><p class="sm">Iuran saat ini: '+rp(nom(cur()))+' per bulan. Perubahan hanya berlaku mulai bulan yang dipilih, bulan lama tetap.</p><div class="row"><input id="cn" inputmode="numeric" placeholder="Nominal baru"><input id="cm" type="month" value="'+cur()+'"><button class="btn" id="cok">Terapkan</button></div></div>'+
 '<div class="card"><h2>Pengingat tunggakan</h2><button class="btn ghost" id="rem">Buat pesan pengingat</button><textarea id="rt" hidden readonly></textarea><button class="btn" id="rcp" hidden>Salin</button></div>';
 money($('#cn'));
 $('#aok').onclick=function(){var n=$('#an').value.trim().replace(/\s+/g,' '),i=$('#ai').value.trim(),m=$('#am').value;
  if(!n||!m){$('#amsg').textContent='Isi nama dan bulan mulai.';return}
  if(dup(i)){$('#amsg').textContent='NIM itu sudah dipakai.';return}
  db.collection('members').add({nama:n,nim:i,mulai:m,aktif:true,ts:Date.now()});logw('Tambah anggota',n);$('#an').value=$('#ai').value='';$('#amsg').textContent=''};
 $('#ipr').onclick=preview;$('#iok').onclick=doImport;$('#iun').onclick=undoImport;
 $('#cok').onclick=function(){var v=num($('#cn').value),m=$('#cm').value;if(!v||!m)return;var nk=(CFG.naik||[]).filter(function(x){return x.dari!==m});nk.push({dari:m,nominal:v});db.doc('cfg/main').set({base:CFG.base||10000,naik:nk});logw('Ubah iuran',rp(v)+' mulai '+bln(m))};
 $('#rem').onclick=function(){var bk=D.filter(function(m){return m.aktif!==false&&m.kurang>0}).sort(function(a,b){return a.nama.localeCompare(b.nama,'id')});
  var t=bk.length?'Pengingat kas kelas ('+bln(cur())+'). Yang belum lunas:\n'+bk.map(function(m,i){return (i+1)+'. '+m.nama+(m.nim?' ('+m.nim+')':'')+' - kurang '+rp(m.kurang)}).join('\n')+'\nTerima kasih.':'Semua anggota sudah lunas.';

var PV=[];
function parse(t){return t.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){l=l.replace(/^\d{1,3}[.)]\s+/,'');var x=l.match(/\d{5,}/),nim=x?x[0]:'';
 var n=l.replace(nim,'').replace(/[\t,;|]+/g,' ').replace(/\s[-\u2013]\s/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|\s)\S/g,function(s){return s.toUpperCase()});return {nama:n,nim:nim}})}
function preview(){var R=parse($('#ib').value),seen={};
 PV=R.map(function(r){var s='ok',w='';
  if(r.nim&&(dup(r.nim)||seen[r.nim])){s='bad';w='NIM kembar'}
  else if(!r.nim||!r.nama){s='warn';w=!r.nim?'NIM kosong':'Nama kosong'}
  else if(M.some(function(m){return m.nama.toLowerCase()===r.nama.toLowerCase()})){s='warn';w='Mungkin dobel'}
  if(r.nim)seen[r.nim]=1;r.s=s;r.w=w;return r}).sort(function(a,b){return a.nama.localeCompare(b.nama,'id')});
 var c=function(s){return PV.filter(function(r){return r.s===s}).length};
 $('#ipv').innerHTML='<p class="sm"><b>'+c('ok')+' siap, '+c('warn')+' perlu dicek, '+c('bad')+' bermasalah.</b> Baris bermasalah dilewati.</p>'+PV.map(function(r){return '<div class="pv"><span class="chip '+(r.s==='ok'?'lunas':r.s==='warn'?'kurang':'belum')+'">'+(r.s==='ok'?'siap':r.s==='warn'?'cek':'salah')+'</span><span>'+esc(r.nama||'(tanpa nama)')+'</span><span class="mono">'+esc(r.nim)+'</span><span class="sm">'+r.w+'</span></div>'}).join('');
 $('#iok').hidden=!PV.some(function(r){return r.s!=='bad'&&r.nama})}
function doImport(){var b=Date.now(),m=$('#im').value,n=0;if(!m)return;
 PV.forEach(function(r){if(r.s==='bad'||!r.nama)return;db.collection('members').add({nama:r.nama,nim:r.nim,mulai:m,aktif:true,batch:b,ts:b});n++});
 logw('Impor anggota',n+' anggota, mulai ditagih '+bln(m));$('#ib').value='';$('#ipv').innerHTML='';$('#iok').hidden=true;$('#imsg').textContent=n+' anggota diimpor. Daftar urut nama.'}
function undoImport(){var bs=M.map(function(m){return m.batch||0}),b=Math.max.apply(null,bs);if(!b){$('#imsg').textContent='Tidak ada impor yang bisa dibatalkan.';return}
 if(armed!=='undo')$('#imsg').textContent='Tekan sekali lagi untuk membatalkan impor terakhir.';
 if(!arm('undo'))return;var n=0;M.forEach(function(m){if(m.batch===b&&!P.some(function(p){return p.mid===m.id})){db.doc('members/'+m.id).delete();n++}});logw('Batalkan impor',n+' anggota dihapus');$('#imsg').textContent=n+' anggota hasil impor terakhir dihapus (yang sudah punya pembayaran dipertahankan).'}

/* ---------- Catat ---------- */
function fCatat(){var s=$('#pm'),v=s.value,ak=D.filter(function(m){return m.aktif!==false}).sort(function(a,b){return a.nama.localeCompare(b.nama,'id')});
 s.innerHTML='<option value="">Pilih anggota</option>'+ak.map(function(m){return '<option value="'+m.id+'">'+esc(m.nama)+' ('+esc(m.nim)+')'+(m.kurang>0?' - kurang '+rp(m.kurang):'')+'</option>'}).join('');s.value=v;
 var H=P.map(function(p){return {id:p.id,tgl:p.tgl,t:'in',ket:((M.find(function(m){return m.id===p.mid})||{}).nama||'?'),j:p.jumlah,a:'dp'}}).concat(X.filter(function(x){return x.kind!=='kembali'}).map(function(x){return {id:x.id,tgl:x.tgl,t:'out',ket:x.ket,j:x.jumlah,a:'dx'}})).sort(function(a,b){return a.tgl<b.tgl?1:-1}).slice(0,12);
 $('#hist').innerHTML=H.map(function(h){return '<div class="pv"><span>'+esc(h.tgl)+'</span><span>'+esc(h.ket)+'</span><span class="mono '+h.t+'">'+(h.t==='in'?'+':'-')+rp(h.j)+'</span><button class="btn ghost sm2 del" data-a="'+h.a+'" data-id="'+h.id+'">'+(armed===h.a+h.id?'Yakin?':'Hapus')+'</button></div>'}).join('')||'<p class="sm">Belum ada catatan.</p>'}
function addPay(e){e.preventDefault();var id=$('#pm').value,j=num($('#pj').value),t=$('#pt').value,m=D.find(function(x){return x.id===id});
 if(!m||!j||!t){$('#pmsg').className='err';$('#pmsg').textContent='Lengkapi anggota, tanggal, dan jumlah.';return}
 db.collection('pay').add({mid:id,tgl:t,jumlah:j,ts:Date.now()}).catch(function(){$('#pmsg').className='err';$('#pmsg').textContent='Gagal menyimpan.'});
 var lb=Math.max(0,m.paid+j-m.tagih);$('#pmsg').className='ok';
 $('#pmsg').textContent='Tersimpan: '+m.nama+' '+rp(j)+'.'+(lb>0?' Ada lebihan '+rp(lb)+': otomatis jadi titipan untuk bulan berikutnya. Kembalikan lewat tab Anggota bila perlu.':'');
 $('#pj').value='';$('#pm').value=''}
function addExp(e){e.preventDefault();var k=$('#xk').value.trim(),j=num($('#xj').value),t=$('#xt').value;if(!k||!j||!t){$('#xmsg').className='err';$('#xmsg').textContent='Lengkapi keterangan, tanggal, dan jumlah.';return}
 db.collection('exp').add({tgl:t,ket:k,jumlah:j,kind:'keluar',ts:Date.now()});$('#xmsg').className='ok';$('#xmsg').textContent='Tersimpan.';$('#xk').value=$('#xj').value=''}

/* ---------- Laporan ---------- */
function fRep(){var all=P.map(function(p){return {t:p.tgl.slice(0,7),i:p.jumlah,o:0}}).concat(X.map(function(x){return {t:(x.tgl||'').slice(0,7),i:0,o:x.jumlah}})),by={};
 all.forEach(function(r){var o=by[r.t]||(by[r.t]={i:0,o:0});o.i+=r.i;o.o+=r.o});
 var ks=Object.keys(by).sort(),run=0,rows=ks.map(function(k){run+=by[k].i-by[k].o;return '<tr><td>'+bln(k)+'</td><td class="mono in">'+rp(by[k].i)+'</td><td class="mono out">'+rp(by[k].o)+'</td><td class="mono">'+rp(run)+'</td></tr>'}).reverse().join('');
 $('#rep').innerHTML='<div class="card"><h2>Rekap bulanan</h2><div style="overflow-x:auto"><table><tr><th>Bulan</th><th>Masuk</th><th>Keluar</th><th>Saldo akhir</th></tr>'+(rows||'<tr><td colspan="4" class="sm">Belum ada data.</td></tr>')+'</table></div></div>'+
 '<div class="card"><h2>Riwayat perubahan</h2>'+(LOG.map(function(l){return '<div class="pv"><span class="sm">'+new Date(l.ts).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span><span><b>'+esc(l.aksi)+'</b>: '+esc(l.ket)+'</span></div>'}).join('')||'<p class="sm">Belum ada perubahan.</p>')+'</div>'}
