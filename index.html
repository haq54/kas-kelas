<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kas Kelas</title>
<meta name="description" content="Pencatatan kas kelas">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon_192x192.png">
<link rel="apple-touch-icon" href="icon_192x192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

<style>
/* ===== Tema ===== */
:root {
  color-scheme: light;
  --bg: #F2F4F1;  --surface: #fff;  --field: #F6F8F5;
  --ink: #16231F; --muted: #5E6B66; --line: #DCE2DD;
  --accent: #1F4E79; --accent-ink: #fff;
  --in: #18794E;  --in-soft: #E1F1E8;
  --out: #B23A2B; --out-soft: #F8E6E2;
  --warn: #8A6100; --warn-soft: #FBF0D0;
  --fd: "Familjen Grotesk", system-ui, sans-serif;
  --fb: "IBM Plex Sans", system-ui, sans-serif;
  --fm: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1613;  --surface: #18221E;  --field: #121B17;
    --ink: #E7EEEA; --muted: #93A39B; --line: #2A3832;
    --accent: #7FB0E0; --accent-ink: #0F1613;
    --in: #5CC58D;  --in-soft: #173126;
    --out: #F0897A; --out-soft: #3A1D19;
    --warn: #E6C265; --warn-soft: #3A311A;
  }
}

/* ===== Dasar ===== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--fb);
  padding: calc(20px + env(safe-area-inset-top, 0px))
           max(14px, env(safe-area-inset-right, 0px))
           calc(40px + env(safe-area-inset-bottom, 0px))
           max(14px, env(safe-area-inset-left, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font: 700 1.6rem/1.2 var(--fd); margin: 0; }
h2 { font: 600 1.05rem/1.3 var(--fd); margin: 0; }

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.badge {
  font-size: .78rem; font-weight: 600; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 99px;
  padding: 2px 10px; cursor: pointer;
}

/* ===== Navigasi ===== */
nav {
  display: grid; gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
nav button {
  height: 36px; border: 0; border-radius: 7px; background: none;
  color: var(--muted); font-weight: 600; font-size: .88rem; cursor: pointer;
}
nav button[aria-pressed=true] { background: var(--ink); color: var(--bg); }

/* ===== Komponen ===== */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.lab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font: 700 clamp(2rem, 8vw, 2.8rem)/1.1 var(--fd); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--fm); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid > div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.sm { font-size: .85rem; color: var(--muted); margin: 0; }
.in { color: var(--in); }
.out { color: var(--out); }
.err { color: var(--out); font-size: .88rem; margin: 0; }
.ok  { color: var(--in);  font-size: .88rem; margin: 0; }

.alert { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: .9rem; font-weight: 500; }
.alert.red { background: var(--out-soft); color: var(--out); }
.alert.green { background: var(--in-soft); color: var(--in); }

input, select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px;
  background: var(--field); border: 1px solid var(--line); border-radius: 8px;
}
textarea { min-height: 110px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 9rem; }

.btn {
  min-height: 42px; padding: 0 16px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 600; cursor: pointer; flex: 0 0 auto; width: auto;
}
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
.btn.sm2 { min-height: 34px; padding: 0 12px; font-size: .85rem; }
.btn.del { color: var(--out); }
.btn:disabled { opacity: .6; cursor: default; }

/* ===== Daftar anggota ===== */
.m { border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.m:first-child { border-top: 0; }
.m b { display: block; }
.m small { color: var(--muted); font-family: var(--fm); }
.chip { font-size: .78rem; font-weight: 600; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.lunas  { background: var(--in-soft);   color: var(--in); }
.kurang { background: var(--warn-soft); color: var(--warn); }
.belum  { background: var(--out-soft);  color: var(--out); }
.off    { background: var(--field);     color: var(--muted); }
.det { background: var(--field); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

/* ===== Tabel & baris riwayat ===== */
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: .72rem; color: var(--muted); text-transform: uppercase; border-top: 0; }
.pv { font-size: .85rem; border-top: 1px solid var(--line); padding: 4px 0; display: flex; gap: 8px; align-items: center; }
.pv > :nth-last-child(1):not(:first-child) { margin-left: auto; }

/* ===== Layar login ===== */
#lgn { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lgc { width: 100%; max-width: 400px; gap: 12px; padding: 22px; }
.lgc .btn { width: 100%; }
.lnk { background: none; border: 0; color: var(--accent); text-decoration: underline; font-size: .88rem; cursor: pointer; align-self: center; padding: 6px; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>
<div class="wrap">
  <header>
    <h1>Kas Kelas</h1>
    <button type="button" class="badge" id="role">Memuat…</button>
  </header>
  <nav id="nav"></nav>
  <div id="note"></div>
  <div id="view"></div>
  <noscript><div class="alert red">Aplikasi ini membutuhkan JavaScript.</div></noscript>
</div>

<div id="lgn" hidden>
  <form id="lgF" class="card lgc">
    <h1>Kas Kelas</h1>
    <p class="sm">Masuk sebagai bendahara untuk mengubah data kas.</p>
    <label class="lab" for="lgE">Email</label>
    <input id="lgE" type="email" autocomplete="username" placeholder="nama@email.com" required>
    <label class="lab" for="lgS">Kata sandi</label>
    <input id="lgS" type="password" autocomplete="current-password" placeholder="Kata sandi" required>
    <div id="lgErr" class="sm" role="alert" style="color:var(--out)"></div>
    <button class="btn" id="lgBtn" type="submit">Masuk</button>
    <button class="btn ghost" id="lgBatal" type="button">Kembali</button>
    <button class="lnk" id="lgLupa" type="button">Lupa kata sandi?</button>
  </form>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
   * Konfigurasi Firebase
   * ========================================================= */
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDzBP0ULv5qs-TB5ygQcT8YJDYyD39kjiE',
    authDomain: 'kas-kelas-b3e65.firebaseapp.com',
    projectId: 'kas-kelas-b3e65',
    storageBucket: 'kas-kelas-b3e65.firebasestorage.app',
    messagingSenderId: '423093944122',
    appId: '1:423093944122:web:b87e9413efbfe5dc8fda03'
  };
  var TOTAL_SUMBER = 5; // members, pay, exp, log, cfg

  /* =========================================================
   * State
   * ========================================================= */
  var db = null, auth = null;
  var canEdit = false;
  var M = [];                        // anggota (mentah)
  var P = [];                        // pembayaran iuran
  var X = [];                        // pengeluaran (termasuk pengembalian)
  var LOG = [];                      // riwayat perubahan
  var CFG = { base: 10000, naik: [] };
  var D = [];                        // anggota + hasil hitungan (derive)
  var tab = 'home', sel = null, sortBy = 'nama', q = '';
  var loaded = 0, loadTimer = null;
  var armed = '', armTimer = null;   // konfirmasi hapus dua ketukan
  var PV = [];                       // pratinjau impor

  /* =========================================================
   * Util
   * ========================================================= */
  var $ = function (s) { return document.querySelector(s); };

  var rp = function (n) {
    return (n < 0 ? '-' : '') + 'Rp' + Math.abs(Math.round(n)).toLocaleString('id-ID');
  };

  var esc = function (s) {
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return map[c]; });
  };

  var pad2 = function (n) { return String(n).padStart(2, '0'); };

  var today = function () {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };

  var cur = function () { return today().slice(0, 7); };

  var BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var bln = function (s) {
    var a = String(s).split('-');
    return BULAN[a[1] - 1] + ' ' + a[0];
  };

  var sum = function (arr, fn) {
    return arr.reduce(function (t, x) { return t + (fn(x) || 0); }, 0);
  };
  var jml = function (x) { return x.jumlah; };

  var num = function (s) { return parseInt(String(s).replace(/\D/g, '') || '0', 10); };

  var byNama = function (a, b) { return a.nama.localeCompare(b.nama, 'id'); };
  var terbaru = function (a, b) { return a.tgl < b.tgl ? 1 : -1; };
  var isAktif = function (m) { return m.aktif !== false; };

  /** Daftar bulan 'YYYY-MM' dari a sampai b (inklusif). */
  function rentangBulan(a, b) {
    var r = [], p = a.split('-').map(Number), e = b.split('-').map(Number);
    var y = p[0], m = p[1];
    while (y < e[0] || (y === e[0] && m <= e[1])) {
      r.push(y + '-' + pad2(m));
      if (++m > 12) { m = 1; y++; }
    }
    return r;
  }

  /** Format input rupiah: 1500000 -> 1.500.000 */
  function maskRupiah(el) {
    el.addEventListener('input', function () {
      var d = el.value.replace(/\D/g, '').slice(0, 12);
      el.value = d ? Number(d).toLocaleString('id-ID') : '';
    });
  }

  function note(msg, cls) {
    $('#note').innerHTML = msg ? '<div class="alert ' + (cls || '') + '">' + msg + '</div>' : '';
  }

  /** Tombol dua ketukan: true bila ketukan kedua terjadi dalam 3,5 detik. */
  function arm(k) {
    clearTimeout(armTimer);
    if (armed === k) { armed = ''; return true; }
    armed = k;
    armTimer = setTimeout(function () { armed = ''; fill(); }, 3500);
    fill();
    return false;
  }

  /** Tulis ke Firestore; beri tahu bendahara bila ditolak. */
  function tulis(promise) {
    return promise.catch(function () {
      note('Gagal menyimpan. Cek koneksi atau izin akun.', 'red');
    });
  }

  function catatLog(aksi, ket) {
    if (db) db.collection('log').add({ ts: Date.now(), aksi: aksi, ket: ket }).catch(function () {});
  }

  function nimDipakai(nim, kecuali) {
    return !!nim && M.some(function (m) { return m.nim === nim && m.id !== kecuali; });
  }

  /* =========================================================
   * Perhitungan iuran
   * ========================================================= */

  /** Nominal iuran yang berlaku pada bulan b ('YYYY-MM'). */
  function nominal(b) {
    var n = CFG.base || 10000;
    (CFG.naik || []).slice()
      .sort(function (a, c) { return a.dari < c.dari ? -1 : 1; })
      .forEach(function (x) { if (x.dari <= b) n = x.nominal; });
    return n;
  }

  /** Hitung tagihan, pembayaran, kurang/lebih, dan status satu anggota. */
  function hitung(m) {
    var skrg = cur();
    var akhir = (m.aktif === false && m.selesai && m.selesai < skrg) ? m.selesai : skrg;
    var bulan = (m.mulai && m.mulai <= akhir) ? rentangBulan(m.mulai, akhir) : [];

    var bayar = sum(P.filter(function (p) { return p.mid === m.id; }), jml)
              - sum(X.filter(function (x) { return x.mid === m.id && x.kind === 'kembali'; }), jml);

    var sisa = bayar;
    var rows = bulan.map(function (b) {
      var n = nominal(b);
      var terisi = Math.max(0, Math.min(sisa, n));
      sisa -= terisi;
      return { b: b, n: n, c: terisi };
    });

    var tagih = sum(rows, function (r) { return r.n; });
    var terakhir = rows[rows.length - 1];
    return {
      rows: rows,
      paid: bayar,
      tagih: tagih,
      kurang: Math.max(0, tagih - bayar),
      kredit: Math.max(0, bayar - tagih),
      st: tagih <= bayar ? 'lunas' : (terakhir && terakhir.c > 0 ? 'kurang' : 'belum')
    };
  }

  function derive() {
    D = M.map(function (m) { return Object.assign({}, m, hitung(m)); });
  }

  /* =========================================================
   * Tab & render utama
   * ========================================================= */
  function renderNav() {
    var t = [['home', 'Beranda'], ['anggota', 'Anggota'], ['catat', 'Catat'], ['laporan', 'Laporan']];
    if (!canEdit) t.splice(2, 1);
    var el = $('#nav');
    el.style.gridTemplateColumns = 'repeat(' + t.length + ', 1fr)';
    el.innerHTML = t.map(function (x) {
      return '<button data-t="' + x[0] + '" aria-pressed="' + (tab === x[0]) + '">' + x[1] + '</button>';
    }).join('');
  }

  function siap() { return !db || loaded >= TOTAL_SUMBER; }

  /** Bangun kerangka tab aktif, lalu isi datanya. */
  function show() {
    renderNav();
    var v = $('#view');

    if (!siap()) { v.innerHTML = '<p class="sm">Memuat…</p>'; return; }

    if (tab === 'home') {
      v.innerHTML = '<div id="sum" class="wrap"></div>';
    }
    if (tab === 'anggota') {
      v.innerHTML =
        '<div class="wrap">' +
          '<div class="card">' +
            '<div class="row">' +
              '<input id="q" placeholder="Cari nama atau NIM" value="' + esc(q) + '">' +
              '<select id="so"><option value="nama">Urut nama</option><option value="nim">Urut NIM</option></select>' +
            '</div>' +
            '<div id="list"></div>' +
          '</div>' +
          '<div id="adm" class="wrap"></div>' +
        '</div>';
      $('#so').value = sortBy;
      $('#q').oninput = function () { q = this.value; fAnggota(); };
      $('#so').onchange = function () { sortBy = this.value; fAnggota(); };
      renderAdmin();
    }
    if (tab === 'catat') {
      v.innerHTML =
        '<div class="wrap">' +
          '<form id="fp" class="card">' +
            '<h2>Catat iuran masuk</h2>' +
            '<select id="pm" required></select>' +
            '<div class="row"><input id="pt" type="date" required><input id="pj" inputmode="numeric" placeholder="Jumlah (Rp)" required></div>' +
            '<button class="btn">Simpan iuran</button><p id="pmsg" class="sm"></p>' +
          '</form>' +
          '<form id="fx" class="card">' +
            '<h2>Catat pengeluaran</h2>' +
            '<input id="xk" placeholder="Keperluan, misalnya fotokopi materi" required>' +
            '<div class="row"><input id="xt" type="date" required><input id="xj" inputmode="numeric" placeholder="Jumlah (Rp)" required></div>' +
            '<button class="btn">Simpan pengeluaran</button><p id="xmsg" class="sm"></p>' +
          '</form>' +
          '<div class="card"><h2>Catatan terakhir</h2><div id="hist"></div></div>' +
        '</div>';
      $('#pt').value = $('#xt').value = today();
      maskRupiah($('#pj'));
      maskRupiah($('#xj'));
      $('#fp').onsubmit = tambahIuran;
      $('#fx').onsubmit = tambahPengeluaran;
    }
    if (tab === 'laporan') {
      v.innerHTML = '<div id="rep" class="wrap"></div>';
    }
    fill();
  }

  /** Isi ulang data tab aktif tanpa membangun ulang kerangkanya. */
  function fill() {
    if (!siap()) return;
    derive();
    ({ home: fHome, anggota: fAnggota, catat: fCatat, laporan: fLaporan })[tab]();
  }

  $('#nav').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) { tab = b.dataset.t; show(); }
  });

  /* =========================================================
   * Tab: Beranda
   * ========================================================= */
  function fHome() {
    var aktif = D.filter(isAktif);
    var masuk = sum(P, jml);
    var keluar = sum(X, jml);
    var titipan = sum(D, function (m) { return m.kredit; });
    var saldo = masuk - keluar - titipan;
    var belum = aktif.filter(function (m) { return m.kurang > 0; });
    var tunggakan = sum(aktif, function (m) { return m.kurang; });
    var nonaktifLebih = D.filter(function (m) { return m.aktif === false && m.kredit > 0; });

    var pengeluaran = X.filter(function (x) { return x.kind !== 'kembali'; })
      .sort(terbaru).slice(0, 5)
      .map(function (x) {
        return '<div class="pv"><span>' + esc(x.tgl) + '</span><span>' + esc(x.ket) + '</span>' +
               '<span class="mono out">' + rp(x.jumlah) + '</span></div>';
      }).join('');

    $('#sum').innerHTML =
      '<div class="card">' +
        '<span class="lab">Saldo kas kelas</span>' +
        '<span class="big mono ' + (saldo < 0 ? 'out' : '') + '">' + rp(saldo) + '</span>' +
        '<p class="sm">Uang di tangan bendahara: ' + rp(masuk - keluar) +
          (titipan > 0 ? ' &middot; titipan anggota: ' + rp(titipan) : '') + '</p>' +
        '<div class="grid">' +
          '<div><span class="lab in">Masuk</span><div class="mono">' + rp(masuk) + '</div></div>' +
          '<div><span class="lab out">Keluar</span><div class="mono">' + rp(keluar) + '</div></div>' +
        '</div>' +
      '</div>' +
      (belum.length
        ? '<div class="alert red">' + belum.length + ' anggota belum lunas &middot; total tunggakan ' + rp(tunggakan) + '. Lihat tab Anggota.</div>'
        : '<div class="alert green">Semua anggota aktif sudah lunas sampai ' + bln(cur()) + '.</div>') +
      (nonaktifLebih.length
        ? '<div class="alert">' + nonaktifLebih.length + ' anggota nonaktif masih punya lebihan yang perlu dikembalikan.</div>'
        : '') +
      '<div class="card"><h2>Pengeluaran terakhir</h2>' +
        (pengeluaran || '<p class="sm">Belum ada pengeluaran.</p>') +
      '</div>';
  }

  /* =========================================================
   * Tab: Anggota
   * ========================================================= */
  function chipStatus(m) {
    return m.aktif === false
      ? '<span class="chip off">nonaktif</span>'
      : '<span class="chip ' + m.st + '">' + m.st + '</span>';
  }

  function fAnggota() {
    var f = q.toLowerCase();
    var L = D.filter(function (m) {
      return !f || m.nama.toLowerCase().indexOf(f) > -1 || String(m.nim || '').indexOf(f) > -1;
    });
    L.sort(function (a, b) {
      return sortBy === 'nim'
        ? String(a.nim || '').localeCompare(String(b.nim || ''), 'id', { numeric: true })
        : byNama(a, b);
    });

    var html = L.map(function (m) {
      var row =
        '<div class="m" data-s="' + m.id + '">' +
          '<div><b>' + esc(m.nama) + '</b><small>' + esc(m.nim || 'tanpa NIM') + '</small></div>' +
          '<div style="text-align:right">' + chipStatus(m) +
            (m.kurang > 0 && isAktif(m) ? '<div class="sm mono">kurang ' + rp(m.kurang) + '</div>' : '') +
            (m.kredit > 0 ? '<div class="sm mono in">lebih ' + rp(m.kredit) + '</div>' : '') +
          '</div>' +
        '</div>';
      return sel === m.id ? row + detail(m) : row;
    }).join('');

    $('#list').innerHTML = html ||
      '<p class="sm">' + (M.length ? 'Tidak ada yang cocok.' : 'Belum ada anggota.' + (canEdit ? ' Impor daftar di bawah.' : '')) + '</p>';
  }

  function detail(m) {
    var bayar = P.filter(function (p) { return p.mid === m.id; }).sort(terbaru);

    var tabel = '<table><tr><th>Bulan</th><th>Tagihan</th><th>Terbayar</th></tr>' +
      m.rows.slice().reverse().map(function (r) {
        return '<tr><td>' + bln(r.b) + '</td><td class="mono">' + rp(r.n) + '</td>' +
               '<td class="mono ' + (r.c >= r.n ? 'in' : 'out') + '">' + rp(r.c) + '</td></tr>';
      }).join('') + '</table>';

    var info = '<p class="sm">Mulai ditagih: ' + (m.mulai ? bln(m.mulai) : '-') +
      (m.selesai ? ' &middot; berhenti: ' + bln(m.selesai) : '') + '</p>';

    var riwayat = bayar.map(function (p) {
      return '<div class="pv"><span>' + esc(p.tgl) + '</span><span class="mono in">' + rp(p.jumlah) + '</span>' +
        (canEdit
          ? '<span><button class="btn ghost sm2 del" data-a="dp" data-id="' + p.id + '">' +
              (armed === 'dp' + p.id ? 'Yakin?' : 'Hapus') + '</button></span>'
          : '') +
        '</div>';
    }).join('');

    var h = '<div class="det">' + tabel + info + riwayat;

    if (canEdit) {
      h += '<div class="row">' +
             '<input id="en" value="' + esc(m.nama) + '">' +
             '<input id="ei" value="' + esc(m.nim) + '" inputmode="numeric">' +
             '<button class="btn sm2" data-a="sv" data-id="' + m.id + '">Simpan</button>' +
           '</div><p id="emsg" class="err"></p>' +
           '<div class="row">' +
             (m.kredit > 0
               ? '<button class="btn ghost sm2" data-a="kb" data-id="' + m.id + '">Kembalikan lebihan ' + rp(m.kredit) + '</button>'
               : '') +
             '<button class="btn ghost sm2" data-a="tg" data-id="' + m.id + '">' +
               (m.aktif === false ? 'Aktifkan lagi' : 'Nonaktifkan') + '</button>' +
             (bayar.length
               ? ''
               : '<button class="btn ghost sm2 del" data-a="dm" data-id="' + m.id + '">' +
                   (armed === 'dm' + m.id ? 'Yakin hapus?' : 'Hapus anggota') + '</button>') +
           '</div>' +
           (m.aktif === false && m.kredit > 0
             ? '<p class="err">Anggota nonaktif masih punya lebihan: kembalikan karena tidak ada bulan berikutnya.</p>'
             : '');
    }
    return h + '</div>';
  }

  /** Semua aksi tombol & ketukan baris di dalam #view. */
  $('#view').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]');

    if (!b) {
      var r = e.target.closest('[data-s]');
      if (r) { sel = (sel === r.dataset.s) ? null : r.dataset.s; fAnggota(); }
      return;
    }
    if (!db || !canEdit) return;

    var a = b.dataset.a, id = b.dataset.id;
    var m = D.find(function (x) { return x.id === id; });

    if (a === 'sv') {
      var nama = $('#en').value.trim().replace(/\s+/g, ' ');
      var nim = $('#ei').value.trim();
      if (!nama) { $('#emsg').textContent = 'Nama tidak boleh kosong.'; return; }
      if (nimDipakai(nim, id)) { $('#emsg').textContent = 'NIM itu sudah dipakai anggota lain.'; return; }
      tulis(db.doc('members/' + id).update({ nama: nama, nim: nim }));
      catatLog('Ubah anggota', m.nama + ' (NIM ' + (m.nim || '-') + ') menjadi ' + nama + ' (NIM ' + (nim || '-') + ')');
    }

    if (a === 'tg') {
      var aktifkan = (m.aktif === false);
      tulis(db.doc('members/' + id).update(aktifkan ? { aktif: true, selesai: null } : { aktif: false, selesai: cur() }));
      catatLog('Status anggota', m.nama + (aktifkan ? ' diaktifkan' : ' dinonaktifkan'));
    }

    if (a === 'kb') {
      tulis(db.collection('exp').add({
        tgl: today(), ket: 'Pengembalian kelebihan - ' + m.nama,
        jumlah: m.kredit, kind: 'kembali', mid: id, ts: Date.now()
      }));
      catatLog('Kembalikan lebihan', m.nama + ' ' + rp(m.kredit));
    }

    if (a === 'dp') {
      if (!arm('dp' + id)) return;
      var p = P.find(function (x) { return x.id === id; });
      if (!p) return;
      var pm = M.find(function (x) { return x.id === p.mid; }) || {};
      tulis(db.doc('pay/' + id).delete());
      catatLog('Hapus iuran', (pm.nama || '?') + ' ' + rp(p.jumlah) + ' tgl ' + p.tgl);
    }

    if (a === 'dx') {
      if (!arm('dx' + id)) return;
      var x = X.find(function (z) { return z.id === id; });
      if (!x) return;
      tulis(db.doc('exp/' + id).delete());
      catatLog('Hapus catatan keluar', x.ket + ' ' + rp(x.jumlah));
    }

    if (a === 'dm') {
      if (!arm('dm' + id)) return;
      tulis(db.doc('members/' + id).delete());
      sel = null;
      catatLog('Hapus anggota', m.nama);
    }
  });

  /* =========================================================
   * Anggota: tambah, impor, iuran, pengingat
   * ========================================================= */
  function renderAdmin() {
    var h = $('#adm');
    if (!canEdit) { h.innerHTML = ''; return; }

    h.innerHTML =
      '<div class="card"><h2>Tambah anggota</h2>' +
        '<div class="row"><input id="an" placeholder="Nama"><input id="ai" inputmode="numeric" placeholder="NIM">' +
        '<input id="am" type="month" value="' + cur() + '"></div>' +
        '<button class="btn" id="aok">Tambah</button><p id="amsg" class="err"></p>' +
      '</div>' +

      '<div class="card"><h2>Impor massal</h2>' +
        '<p class="sm">Tempel satu anggota per baris (nama dan NIM, dipisah tab, koma, atau spasi). Nomor urut di depan diabaikan.</p>' +
        '<textarea id="ib" placeholder="Ahmad Haqi 2021001&#10;Budi Santoso, 2021002"></textarea>' +
        '<div class="row"><label class="sm">Mulai ditagih bulan<input id="im" type="month" value="' + cur() + '"></label></div>' +
        '<div id="ipv"></div>' +
        '<div class="row"><button class="btn ghost" id="ipr">Pratinjau</button>' +
        '<button class="btn" id="iok" hidden>Impor</button>' +
        '<button class="btn ghost del" id="iun">Batalkan impor terakhir</button></div>' +
        '<p id="imsg" class="sm"></p>' +
      '</div>' +

      '<div class="card"><h2>Pengaturan iuran</h2>' +
        '<p class="sm">Iuran saat ini: ' + rp(nominal(cur())) + ' per bulan. Perubahan hanya berlaku mulai bulan yang dipilih, bulan lama tetap.</p>' +
        '<div class="row"><input id="cn" inputmode="numeric" placeholder="Nominal baru">' +
        '<input id="cm" type="month" value="' + cur() + '"><button class="btn" id="cok">Terapkan</button></div>' +
      '</div>' +

      '<div class="card"><h2>Pengingat tunggakan</h2>' +
        '<button class="btn ghost" id="rem">Buat pesan pengingat</button>' +
        '<textarea id="rt" hidden readonly></textarea><button class="btn" id="rcp" hidden>Salin</button>' +
      '</div>';

    maskRupiah($('#cn'));

    $('#aok').onclick = tambahAnggota;
    $('#ipr').onclick = pratinjauImpor;
    $('#iok').onclick = jalankanImpor;
    $('#iun').onclick = batalkanImpor;
    $('#cok').onclick = ubahIuran;
    $('#rem').onclick = buatPengingat;
    $('#rcp').onclick = function () {
      var t = $('#rt');
      t.select();
      try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); }
      this.textContent = 'Tersalin';
    };
  }

  function tambahAnggota() {
    var nama = $('#an').value.trim().replace(/\s+/g, ' ');
    var nim = $('#ai').value.trim();
    var mulai = $('#am').value;
    if (!nama || !mulai) { $('#amsg').textContent = 'Isi nama dan bulan mulai.'; return; }
    if (nimDipakai(nim)) { $('#amsg').textContent = 'NIM itu sudah dipakai.'; return; }
    tulis(db.collection('members').add({ nama: nama, nim: nim, mulai: mulai, aktif: true, ts: Date.now() }));
    catatLog('Tambah anggota', nama);
    $('#an').value = $('#ai').value = '';
    $('#amsg').textContent = '';
  }

  function ubahIuran() {
    var v = num($('#cn').value), m = $('#cm').value;
    if (!v || !m) return;
    var naik = (CFG.naik || []).filter(function (x) { return x.dari !== m; });
    naik.push({ dari: m, nominal: v });
    tulis(db.doc('cfg/main').set({ base: CFG.base || 10000, naik: naik }));
    catatLog('Ubah iuran', rp(v) + ' mulai ' + bln(m));
  }

  function buatPengingat() {
    var belum = D.filter(function (m) { return isAktif(m) && m.kurang > 0; }).sort(byNama);
    var teks = belum.length
      ? 'Pengingat kas kelas (' + bln(cur()) + '). Yang belum lunas:\n' +
        belum.map(function (m, i) {
          return (i + 1) + '. ' + m.nama + (m.nim ? ' (' + m.nim + ')' : '') + ' - kurang ' + rp(m.kurang);
        }).join('\n') + '\nTerima kasih.'
      : 'Semua anggota sudah lunas.';
    $('#rt').value = teks;
    $('#rt').hidden = false;
    $('#rcp').hidden = false;
    $('#rcp').textContent = 'Salin';
  }

  /* ----- Impor massal ----- */
  function parseImpor(teks) {
    return teks.split(/\r?\n/)
      .map(function (l) { return l.trim(); })
      .filter(Boolean)
      .map(function (l) {
        l = l.replace(/^\d{1,3}[.)]\s+/, '');                 // buang nomor urut
        var cocok = l.match(/\d{5,}/);
        var nim = cocok ? cocok[0] : '';
        var nama = l.replace(nim, '')
          .replace(/[\t,;|]+/g, ' ')
          .replace(/\s[-–]\s/g, ' ')
          .replace(/\s+/g, ' ').trim().toLowerCase()
          .replace(/(^|\s)\S/g, function (s) { return s.toUpperCase(); });
        return { nama: nama, nim: nim };
      });
  }

  function pratinjauImpor() {
    var seen = {};
    PV = parseImpor($('#ib').value).map(function (r) {
      var s = 'ok', w = '';
      if (r.nim && (nimDipakai(r.nim) || seen[r.nim])) { s = 'bad'; w = 'NIM kembar'; }
      else if (!r.nim || !r.nama) { s = 'warn'; w = !r.nim ? 'NIM kosong' : 'Nama kosong'; }
      else if (M.some(function (m) { return m.nama.toLowerCase() === r.nama.toLowerCase(); })) { s = 'warn'; w = 'Mungkin dobel'; }
      if (r.nim) seen[r.nim] = 1;
      r.s = s; r.w = w;
      return r;
    }).sort(byNama);

    var hitungStatus = function (s) { return PV.filter(function (r) { return r.s === s; }).length; };
    var kelas = { ok: 'lunas', warn: 'kurang', bad: 'belum' };
    var label = { ok: 'siap', warn: 'cek', bad: 'salah' };

    $('#ipv').innerHTML =
      '<p class="sm"><b>' + hitungStatus('ok') + ' siap, ' + hitungStatus('warn') + ' perlu dicek, ' +
      hitungStatus('bad') + ' bermasalah.</b> Baris bermasalah dilewati.</p>' +
      PV.map(function (r) {
        return '<div class="pv"><span class="chip ' + kelas[r.s] + '">' + label[r.s] + '</span>' +
               '<span>' + esc(r.nama || '(tanpa nama)') + '</span><span class="mono">' + esc(r.nim) + '</span>' +
               '<span class="sm">' + r.w + '</span></div>';
      }).join('');

    $('#iok').hidden = !PV.some(function (r) { return r.s !== 'bad' && r.nama; });
  }

  function jalankanImpor() {
    var batch = Date.now(), mulai = $('#im').value, n = 0;
    if (!mulai) return;
    PV.forEach(function (r) {
      if (r.s === 'bad' || !r.nama) return;
      tulis(db.collection('members').add({ nama: r.nama, nim: r.nim, mulai: mulai, aktif: true, batch: batch, ts: batch }));
      n++;
    });
    catatLog('Impor anggota', n + ' anggota, mulai ditagih ' + bln(mulai));
    $('#ib').value = '';
    $('#ipv').innerHTML = '';
    $('#iok').hidden = true;
    $('#imsg').textContent = n + ' anggota diimpor. Daftar urut nama.';
    PV = [];
  }

  function batalkanImpor() {
    var batch = Math.max.apply(null, M.map(function (m) { return m.batch || 0; }));
    if (!batch) { $('#imsg').textContent = 'Tidak ada impor yang bisa dibatalkan.'; return; }
    if (armed !== 'undo') $('#imsg').textContent = 'Tekan sekali lagi untuk membatalkan impor terakhir.';
    if (!arm('undo')) return;

    var n = 0;
    M.forEach(function (m) {
      if (m.batch === batch && !P.some(function (p) { return p.mid === m.id; })) {
        tulis(db.doc('members/' + m.id).delete());
        n++;
      }
    });
    catatLog('Batalkan impor', n + ' anggota dihapus');
    $('#imsg').textContent = n + ' anggota hasil impor terakhir dihapus (yang sudah punya pembayaran dipertahankan).';
  }

  /* =========================================================
   * Tab: Catat
   * ========================================================= */
  function fCatat() {
    var s = $('#pm'), pilihan = s.value;
    var aktif = D.filter(isAktif).sort(byNama);

    s.innerHTML = '<option value="">Pilih anggota</option>' + aktif.map(function (m) {
      return '<option value="' + m.id + '">' + esc(m.nama) + ' (' + esc(m.nim) + ')' +
             (m.kurang > 0 ? ' - kurang ' + rp(m.kurang) : '') + '</option>';
    }).join('');
    s.value = pilihan;

    var masuk = P.map(function (p) {
      var pm = M.find(function (m) { return m.id === p.mid; }) || {};
      return { id: p.id, tgl: p.tgl, t: 'in', ket: pm.nama || '?', j: p.jumlah, a: 'dp' };
    });
    var keluar = X.filter(function (x) { return x.kind !== 'kembali'; }).map(function (x) {
      return { id: x.id, tgl: x.tgl, t: 'out', ket: x.ket, j: x.jumlah, a: 'dx' };
    });
    var H = masuk.concat(keluar).sort(terbaru).slice(0, 12);

    $('#hist').innerHTML = H.map(function (h) {
      return '<div class="pv"><span>' + esc(h.tgl) + '</span><span>' + esc(h.ket) + '</span>' +
             '<span class="mono ' + h.t + '">' + (h.t === 'in' ? '+' : '-') + rp(h.j) + '</span>' +
             '<button class="btn ghost sm2 del" data-a="' + h.a + '" data-id="' + h.id + '">' +
               (armed === h.a + h.id ? 'Yakin?' : 'Hapus') + '</button></div>';
    }).join('') || '<p class="sm">Belum ada catatan.</p>';
  }

  function tambahIuran(e) {
    e.preventDefault();
    var id = $('#pm').value, j = num($('#pj').value), t = $('#pt').value;
    var m = D.find(function (x) { return x.id === id; });
    var msg = $('#pmsg');

    if (!m || !j || !t) { msg.className = 'err'; msg.textContent = 'Lengkapi anggota, tanggal, dan jumlah.'; return; }

    db.collection('pay').add({ mid: id, tgl: t, jumlah: j, ts: Date.now() })
      .catch(function () { msg.className = 'err'; msg.textContent = 'Gagal menyimpan.'; });

    var lebih = Math.max(0, m.paid + j - m.tagih);
    msg.className = 'ok';
    msg.textContent = 'Tersimpan: ' + m.nama + ' ' + rp(j) + '.' +
      (lebih > 0 ? ' Ada lebihan ' + rp(lebih) + ': otomatis jadi titipan untuk bulan berikutnya. Kembalikan lewat tab Anggota bila perlu.' : '');
    $('#pj').value = '';
    $('#pm').value = '';
  }

  function tambahPengeluaran(e) {
    e.preventDefault();
    var k = $('#xk').value.trim(), j = num($('#xj').value), t = $('#xt').value;
    var msg = $('#xmsg');

    if (!k || !j || !t) { msg.className = 'err'; msg.textContent = 'Lengkapi keterangan, tanggal, dan jumlah.'; return; }

    db.collection('exp').add({ tgl: t, ket: k, jumlah: j, kind: 'keluar', ts: Date.now() })
      .catch(function () { msg.className = 'err'; msg.textContent = 'Gagal menyimpan.'; });

    msg.className = 'ok';
    msg.textContent = 'Tersimpan.';
    $('#xk').value = $('#xj').value = '';
  }

  /* =========================================================
   * Tab: Laporan
   * ========================================================= */
  function fLaporan() {
    var semua = P.map(function (p) { return { t: p.tgl.slice(0, 7), i: p.jumlah, o: 0 }; })
      .concat(X.map(function (x) { return { t: (x.tgl || '').slice(0, 7), i: 0, o: x.jumlah }; }));

    var perBulan = {};
    semua.forEach(function (r) {
      if (!r.t) return;
      var o = perBulan[r.t] || (perBulan[r.t] = { i: 0, o: 0 });
      o.i += r.i; o.o += r.o;
    });

    var saldo = 0;
    var baris = Object.keys(perBulan).sort().map(function (k) {
      saldo += perBulan[k].i - perBulan[k].o;
      return '<tr><td>' + bln(k) + '</td><td class="mono in">' + rp(perBulan[k].i) + '</td>' +
             '<td class="mono out">' + rp(perBulan[k].o) + '</td><td class="mono">' + rp(saldo) + '</td></tr>';
    }).reverse().join('');

    var riwayat = LOG.map(function (l) {
      var waktu = new Date(l.ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return '<div class="pv"><span class="sm">' + waktu + '</span><span><b>' + esc(l.aksi) + '</b>: ' + esc(l.ket) + '</span></div>';
    }).join('');

    $('#rep').innerHTML =
      '<div class="card"><h2>Rekap bulanan</h2><div style="overflow-x:auto"><table>' +
        '<tr><th>Bulan</th><th>Masuk</th><th>Keluar</th><th>Saldo akhir</th></tr>' +
        (baris || '<tr><td colspan="4" class="sm">Belum ada data.</td></tr>') +
      '</table></div></div>' +
      '<div class="card"><h2>Riwayat perubahan</h2>' + (riwayat || '<p class="sm">Belum ada perubahan.</p>') + '</div>';
  }

  /* =========================================================
   * Login bendahara
   * ========================================================= */
  function bukaLogin() { $('#lgn').hidden = false; $('#lgE').focus(); }
  function tutupLogin() { $('#lgn').hidden = true; $('#lgS').value = ''; $('#lgErr').textContent = ''; }

  $('#role').onclick = function () {
    if (!auth) return;
    if (auth.currentUser) { if (confirm('Keluar dari akun bendahara?')) auth.signOut(); }
    else bukaLogin();
  };
  $('#lgBatal').onclick = tutupLogin;

  $('#lgF').onsubmit = function (ev) {
    ev.preventDefault();
    if (!auth) return;
    var btn = $('#lgBtn'), er = $('#lgErr');
    er.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Memproses…';

    auth.signInWithEmailAndPassword($('#lgE').value.trim(), $('#lgS').value)
      .then(tutupLogin)
      .catch(function (x) {
        er.textContent =
          x.code === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' :
          x.code === 'auth/too-many-requests' ? 'Terlalu banyak percobaan. Coba lagi nanti.' :
          'Email atau kata sandi salah.';
      })
      .then(function () { btn.disabled = false; btn.textContent = 'Masuk'; });
  };

  $('#lgLupa').onclick = function () {
    var email = $('#lgE').value.trim(), er = $('#lgErr');
    if (!auth) return;
    if (!email) { er.textContent = 'Isi email dulu, lalu ketuk Lupa kata sandi.'; return; }
    auth.sendPasswordResetEmail(email)
      .then(function () { er.textContent = 'Jika email terdaftar, tautan reset sudah dikirim.'; })
      .catch(function () { er.textContent = 'Gagal mengirim. Cek email dan koneksi.'; });
  };

  /* =========================================================
   * Mulai
   * ========================================================= */
  function tandaiMuat() {
    if (++loaded === TOTAL_SUMBER) {
      clearTimeout(loadTimer);
      note('');
      show();
    }
  }

  /** Langganan realtime satu koleksi. */
  function langganan(koleksi, simpan, query) {
    var pertama = true;
    (query || db.collection(koleksi)).onSnapshot(function (s) {
      simpan(s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
      if (pertama) { pertama = false; tandaiMuat(); } else { fill(); }
    }, function () {
      note('Data belum bisa dimuat.', 'red');
    });
  }

  function init() {
    renderNav();
    $('#view').innerHTML = '<p class="sm">Memuat…</p>';

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();
    } catch (e) {
      db = null;
    }

    if (!db) {
      $('#role').textContent = 'Hanya lihat';
      $('#view').innerHTML = '<div class="alert red">Koneksi ke server gagal. Cek internet lalu muat ulang.</div>';
      return;
    }

    auth.onAuthStateChanged(function (u) {
      canEdit = !!u;
      $('#role').textContent = canEdit ? 'Bendahara (ketuk untuk keluar)' : 'Hanya lihat (ketuk untuk masuk)';
      if (!canEdit && tab === 'catat') tab = 'home';
      show();
    });

    loadTimer = setTimeout(function () {
      note('Data belum terjangkau, mungkin belum yang terbaru.');
    }, 10000);

    langganan('members', function (a) { M = a; });
    langganan('pay', function (a) { P = a; });
    langganan('exp', function (a) { X = a; });
    langganan('log', function (a) { LOG = a; }, db.collection('log').orderBy('ts', 'desc').limit(40));

    var cfgPertama = true;
    db.doc('cfg/main').onSnapshot(function (s) {
      if (s.exists) CFG = s.data();
      if (cfgPertama) { cfgPertama = false; tandaiMuat(); } else { fill(); }
    }, function () {});
  }

  init();

  /* Service worker (agar bisa dipasang sebagai PWA/APK) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
